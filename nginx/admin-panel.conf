server {
    listen 80;
    server_name admin.yourdomain.com;

    location / {
        auth_basic "Admin";
        auth_basic_user_file /etc/nginx/.htpasswd-admin;

        proxy_pass http://127.0.0.1:8910;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# After certbot runs, it will add the SSL server block automatically.
# Run: certbot --nginx -d admin.yourdomain.com
#
# Note: if using Cloudflare, set to DNS-only (grey cloud) before running certbot.
# Orange cloud (proxied) blocks ACME HTTP challenges.
